project:
  name: qqq_rf_shap_dissertation
  title: Explainable and Optimised Random Forest Framework for QQQ-Relative Portfolio
    Allocation
  benchmark: QQQ
  random_state: 42
data:
  start_date: '2015-01-01'
  end_date: '2026-07-21'
  universe_file: data/external/qqq_universe.csv
  raw_prices_file: data/raw/prices.csv
  model_panel_file: data/processed/model_panel.csv
  raw_data_frequency: daily
  modelling_frequency: monthly
  target_horizon_months: 1
features:
  momentum_windows_months:
  - 1
  - 3
  - 6
  - 12
  volatility_windows_days:
  - 21
  - 63
  beta_window_days: 63
  correlation_window_days: 63
  tracking_error_window_days: 63
  drawdown_window_days: 63
  volume_growth_window_months: 3
  feature_groups:
    momentum:
    - ret_1m
    - ret_3m
    - ret_6m
    - ret_12m
    volume:
    - volume_growth_3m
    risk:
    - volatility_1m
    - volatility_3m
    - beta_3m
    - corr_qqq_3m
    - tracking_error_3m
    - max_drawdown_3m
    qqq_relative:
    - relative_return_1m
    - relative_return_3m
    - relative_return_6m
    - relative_return_12m
target:
  name: outperform_qqq_next_1m
  positive_class_definition: future_stock_return > future_qqq_return
validation:
  method: expanding_window
  optimisation_metric: roc_auc
  minimum_train_months: 60
  validation_window_months: 12
  test_window_months: 24
  purge_gap_months: 1
  final_test_protected: true
model:
  name: random_forest
  baseline:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 5
    max_features: sqrt
    class_weight: null
    random_state: 42
    n_jobs: -1
optimisation:
  enabled: true
  search_method: randomized_search
  n_iter: 50
  scoring: roc_auc
  random_state: 42
  n_jobs: -1
  search_space:
    n_estimators:
    - 100
    - 200
    - 300
    - 500
    max_depth:
    - 5
    - 8
    - 10
    - 12
    - 15
    - null
    min_samples_leaf:
    - 2
    - 5
    - 10
    - 15
    - 20
    max_features:
    - sqrt
    - log2
    class_weight:
    - null
    - balanced
portfolio:
  rebalance_frequency: monthly
  top_k_default: 10
  top_k_values:
  - 5
  - 10
  - 20
  long_only: true
  strategies:
  - top_k_equal_weight
  - probability_weighted
  - risk_adjusted_probability_weighted
  transaction_cost_bps_default: 10
  transaction_cost_bps_values:
  - 0
  - 5
  - 10
  - 25
  - 50
benchmarks:
- qqq_buy_and_hold
- equal_weight_qqq_stocks
metrics:
  classification:
  - accuracy
  - precision
  - recall
  - f1_score
  - roc_auc
  - confusion_matrix
  portfolio:
  - cumulative_return
  - annualised_return
  - annualised_volatility
  - sharpe_ratio
  - sortino_ratio
  - maximum_drawdown
  - calmar_ratio
  - turnover
  - transaction_cost_adjusted_return
shap:
  enabled: false
  compare_baseline_and_optimised: false
  max_background_samples: 0
  max_explanation_samples: 0
robustness:
  enabled: true
  test_top_k_values: true
  test_transaction_costs: true
  test_random_seeds: true
  random_seeds:
  - 1
  - 21
  - 42
  - 84
  - 123
ablation:
  enabled: true
  groups_to_remove:
  - momentum
  - volume
  - risk
  - qqq_relative
outputs:
  models_dir: results/models
  tables_dir: results/tables
  figures_dir: results/figures
  logs_dir: results/logs
  baseline_model_file: results/models/baseline_random_forest.joblib
  optimised_model_file: results/models/optimised_random_forest.joblib
  model_panel_summary_file: results/tables/dataset_summary.csv
  baseline_predictions_file: results/tables/baseline_rf_predictions.csv
  optimised_predictions_file: results/tables/optimised_rf_predictions.csv
  baseline_metrics_file: results/tables/baseline_rf_metrics.csv
  optimised_metrics_file: results/tables/optimised_rf_metrics.csv
  baseline_vs_optimised_file: results/tables/baseline_vs_optimised_results.csv
  optimisation_results_file: results/tables/rf_optimisation_results.csv
  best_params_file: results/tables/rf_best_params.csv
  optimisation_log_file: results/logs/rf_optimisation_log.csv
  shap_baseline_file: results/tables/shap_baseline_feature_importance.csv
  shap_optimised_file: results/tables/shap_optimised_feature_importance.csv
  portfolio_results_file: results/tables/portfolio_performance.csv
  benchmark_results_file: results/tables/benchmark_comparison.csv
  transaction_cost_file: results/tables/transaction_cost_sensitivity.csv
  robustness_file: results/tables/top_k_robustness.csv
  ablation_file: results/tables/feature_ablation_results.csv
reproducibility:
  save_intermediate_outputs: true
  save_models: true
  save_predictions: true
  fixed_random_seed: true
  notes: All stochastic steps use fixed seeds where possible. The final test set remains
    unseen until model selection is complete.
